name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: v2.12.2

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  build:
    name: Build
    strategy:
      # Full 3-OS matrix on push to main; PRs skip macOS (10x minutes on the
      # free tier) — Linux + Windows already cover the cross-platform risk.
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -v ./...
      - run: go vet ./...

  test:
    name: Test
    strategy:
      fail-fast: false
      # Full 3-OS matrix on push to main; PRs skip macOS to conserve minutes.
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    # OIDC; lets each leg mint the Codecov upload token
    permissions:
      contents: read
      id-token: write
    steps:
      # fetch-depth: 0 so Codecov can walk git history for path mapping and so
      # parent/base SHAs exist when the App compares PR head vs main (avoids
      # "Missing base commit" / unusable reports on shallow clones).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # Run in bash on every OS so the working directory and tooling are
      # consistent. Go on the Windows runner writes coverage.out with CRLF line
      # endings, which Codecov's parser rejects (the upload lands in an ERROR
      # state and never merges), so strip CR in the same step. tr is identical
      # on GNU/BSD/Git-bash; the strip is a no-op on Linux/macOS.
      #
      # -race is Linux/macOS only: Windows lacks reliable cgo race support in
      # this project's documented workflow (see AGENTS.md / CLAUDE.md).
      - name: Run tests with coverage
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            go test ./... -v -coverprofile=coverage.out -covermode=atomic
          else
            go test ./... -v -race -coverprofile=coverage.out -covermode=atomic
          fi
          tr -d '\r' < coverage.out > coverage.tmp && mv coverage.tmp coverage.out
      - name: Install gotestsum (Linux)
        if: runner.os == 'Linux'
        run: go install gotest.tools/gotestsum@v1.13.0
      - name: Generate JUnit XML (Linux)
        if: runner.os == 'Linux'
        run: gotestsum --junitfile junit.xml --format pkgname -- ./...
      # Upload per-OS coverage so Codecov merges all legs. A Linux-only report
      # understates true coverage; merging the OS matrix reflects it.
      # use_pypi: true — install CLI from PyPI instead of cli.codecov.io so we
      # skip native-binary GPG verification (fails with "Could not verify
      # signature" when key import is empty; codecov/codecov-action#1876).
      # fail_ci_if_error: false — Codecov is a soft gate; infra flakiness
      # must not fail the required test job and block valid PRs.
      # override_commit/override_branch: required on every run (including push
      # to main) so Codecov stores base reports — action auto-detection only
      # fills these for pull_request events (see codecov.yml).
      - name: Upload coverage to Codecov
        # Skip fork PRs: OIDC tokens aren't issued to forked-repo runs.
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          use_oidc: true
          use_pypi: true
          files: ./coverage.out
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          override_branch: ${{ github.head_ref || github.ref_name }}
          override_pr: ${{ github.event.pull_request.number }}
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        # Test Analytics (failed-test / flaky reporting). Same Action as coverage
        # with report_type: test_results — replaces deprecated test-results-action.
        if: ${{ !cancelled() && runner.os == 'Linux' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          use_oidc: true
          use_pypi: true
          report_type: test_results
          files: ./junit.xml
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          override_branch: ${{ github.head_ref || github.ref_name }}
          override_pr: ${{ github.event.pull_request.number }}
          fail_ci_if_error: false
      # PR jobs must not receive the Codacy repository token. Save the report;
      # a trusted workflow_run workflow downloads this artifact and uploads it.
      - name: Save coverage for Codacy
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: codacy-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.out
          if-no-files-found: error

  goreleaser:
    name: Release build (snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "24"
      # Build-only: verifies .goreleaser.yaml compiles all platforms. NEVER
      # publishes (no `release`, no tag). Catches config breakage on PRs.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7
        with:
          args: build --snapshot --clean
      - name: Smoke-test the built linux binary
        # Exec the freshly built native binary to prove it runs + the version
        # ldflags resolved (not the `dev`/`unknown` fallbacks). The runner is
        # linux/amd64, so glob that build output.
        run: |
          BIN=$(find dist -type f -name fabrica -path '*linux_amd64*' | head -1)
          test -n "$BIN" || { echo "no linux/amd64 fabrica binary in dist/"; exit 1; }
          chmod +x "$BIN"
          OUT=$("$BIN" version)
          echo "$OUT"
          # snapshot builds inject a version like "0.1.0-SNAPSHOT-<sha>"; the
          # binary must NOT show the un-injected "dev" fallback.
          echo "$OUT" | grep -q "Fabrica dev" && { echo "version ldflags did not resolve (still 'dev')"; exit 1; }
          echo "smoke test OK"
      - name: npm shim tests
        working-directory: npm
        run: node --test

  # Optional checks (informational for now — not required by protect-main ruleset).
  # Pattern mirrors Ludus (Windows lint) and Juggernaut (gosec / fs scan).

  lint-windows:
    name: Lint (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: v2.12.2

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run gosec
        # Exclusions (mirrors .golangci.yml rationale):
        #   G204 — command execution audit (AST pattern) — noisy for CLI subprocess calls
        #   G304 — file inclusion via variable — intentional for config file reads
        #   G702 — command injection taint analysis — noisy for CLI tool subprocess invocations
        #   G703 — path traversal taint analysis — noisy for config/state file path resolution
        # Remaining findings use #nosec with per-line rationale.
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.27.1 -exclude=G204,G304,G702,G703 ./...

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # Codacy Static Analysis — runs on push to main to keep the dashboard in sync.
  # PR-level checks come from the GitHub integration webhook; main-level
  # analysis does not fire automatically after squash-merge, so we run the
  # Codacy Analysis CLI here and upload results. Uses the existing project
  # token (CODACY_REPOSITORY_API_TOKEN) — no new secrets needed.
  codacy-analysis:
    name: Codacy Analysis
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08  # v4.4.7
        with:
          project-token: ${{ secrets.CODACY_REPOSITORY_API_TOKEN }}
          upload: true
          # Informational — do not block the pipeline.
          max-allowed-issues: 2147483647
