          def _is_int(value: Any) -> bool:
              return isinstance(value, int) and not isinstance(value, bool)


          def _range(value: Any, name: str, low: int, high: int) -> int:
              if not _is_int(value) or not low <= value <= high:
                  raise PolicyError(f"{name} must be an integer from {low} to {high}")
              return value


          def _patterns(raw: Any, name: str, limit: int, *, allow_slash: bool) -> list[str]:
              if not isinstance(raw, list):
                  raise PolicyError(f"{name} must be a list of patterns")
              if len(raw) > limit:
                  raise PolicyError(f"{name} lists more than {limit} patterns")
              out: list[str] = []
              for item in raw:
                  if not isinstance(item, str) or not item:
                      raise PolicyError(f"{name} entries must be non-empty strings")
                  pattern = item.casefold()
                  if not pattern.isascii() or _PATTERN_RE.fullmatch(pattern) is None:
                      raise PolicyError(f"{name} entry is not an ASCII pattern")
                  if ".." in pattern:
                      raise PolicyError(f"{name} entries must not contain '..'")
                  if pattern.startswith("/"):
                      raise PolicyError(f"{name} entries must not start with '/'")
                  if "//" in pattern:
                      raise PolicyError(f"{name} entries must not contain '//'")
                  if not allow_slash and "/" in pattern:
                      raise PolicyError(f"{name} entries are basename patterns and must not contain '/'")
                  out.append(item)
              return out


          def _app_perms(raw: Any, name: str) -> dict[str, str]:
              if not isinstance(raw, dict) or not raw:
                  raise PolicyError(f"{name} must be a non-empty object of permission scopes")
              out: dict[str, str] = {}
              for key, value in raw.items():
                  if not isinstance(key, str) or _APP_PERM_KEY_RE.fullmatch(key) is None:
                      raise PolicyError(f"{name} keys must be lowercase permission scope names")
                  if key in FORBIDDEN_APP_PERMS:
                      raise PolicyError(f"{name} lists the forbidden permission {key}")
                  if not isinstance(value, str) or value not in _APP_PERM_VALUES:
                      raise PolicyError(f"{name}.{key} must be read or write")
                  out[key] = value
              return out


          def _apps(raw: Any, name: str) -> dict[str, dict[str, Any]]:
              """The reviewed App registry. The config must carry it, with exactly
              the four roles; ids and slugs must be unique across roles."""
              if not isinstance(raw, dict):
                  raise PolicyError(f"{name} is missing from the config or is not an object")
              unknown_roles = sorted(set(raw) - set(_APP_ROLES))
              if unknown_roles:
                  raise PolicyError(f"{name} has unknown roles: {', '.join(unknown_roles)}")
              out: dict[str, dict[str, Any]] = {}
              ids: set[int] = set()
              slugs: set[str] = set()
              for role in _APP_ROLES:
                  entry = raw.get(role)
                  if not isinstance(entry, dict):
                      raise PolicyError(f"{name}.{role} is missing or is not an object")
                  has_perms = "permissions" in entry
                  if role == "actions":
                      allowed = {"app_id", "slug"}
                  else:
                      allowed = {"app_id", "slug", "permissions"}
                  extra = sorted(set(entry) - allowed)
                  if extra:
                      raise PolicyError(f"{name}.{role} has unknown keys: {', '.join(extra)}")
                  if role != "actions" and not has_perms:
                      raise PolicyError(f"{name}.{role} is missing permissions")
                  app_id = entry.get("app_id")
                  if not _is_int(app_id) or app_id < 1:
                      raise PolicyError(f"{name}.{role}.app_id must be a positive integer GitHub App id")
                  if app_id in ids:
                      raise PolicyError(f"{name} lists the same App id for two roles")
                  slug = entry.get("slug")
                  if not isinstance(slug, str) or len(slug) > MAX_APP_SLUG_LEN \
                          or APP_SLUG_RE.fullmatch(slug) is None:
                      raise PolicyError(f"{name}.{role}.slug is not a GitHub App slug")
                  if slug in slugs:
                      raise PolicyError(f"{name} lists the same slug for two roles")
                  out[role] = {"app_id": app_id, "slug": slug}
                  ids.add(app_id)
                  slugs.add(slug)
              for role in ("runner", "qa", "security"):
                  out[role]["permissions"] = _app_perms(raw[role]["permissions"], f"{name}.{role}.permissions")
              return out


          def _private_apps(raw: Any, name: str, reviewed_slugs: set[str]) -> list[str]:
              """The slugs whose /apps/<slug> is expected to 404 (private Apps).
              Each must be one of the reviewed App slugs."""
              if not isinstance(raw, list):
                  raise PolicyError(f"{name} must be a list of App slugs")
              out: list[str] = []
              for slug in raw:
                  if not isinstance(slug, str) or len(slug) > MAX_APP_SLUG_LEN \
                          or APP_SLUG_RE.fullmatch(slug) is None:
                      raise PolicyError(f"{name} entries must be GitHub App slugs")
                  if slug not in reviewed_slugs:
                      raise PolicyError(f"{name} lists a slug that is not a reviewed App: {slug}")
                  if slug in out:
                      raise PolicyError(f"{name} lists a slug twice")
                  out.append(slug)
              return out


          def validate_config(obj: Any) -> dict[str, Any]:
              """The validated, canonical config (every key present, defaults
              filled). Unknown keys, wrong types and bools-as-ints are refused.
              The apps block must be present; it is the only source of App ids."""
              if not isinstance(obj, dict):
                  raise PolicyError("config must be a JSON object")
              unknown = sorted(set(obj) - _CONFIG_KEYS)
              if unknown:
                  raise PolicyError(f"unknown config keys: {', '.join(unknown)}")
              version = obj.get("version")
              if not _is_int(version) or version != CONFIG_VERSION:
                  raise PolicyError(f"version must be {CONFIG_VERSION}")
              max_lines = _range(obj.get("max_lines", DEFAULT_CONFIG["max_lines"]),
                                 "max_lines", 1, MAX_LINES_CEILING)
              max_files = _range(obj.get("max_files", DEFAULT_CONFIG["max_files"]),
                                 "max_files", 1, MAX_FILES_CEILING)
              exempt = obj.get("exempt_user_ids", DEFAULT_CONFIG["exempt_user_ids"])
              if not isinstance(exempt, list) or len(exempt) > MAX_EXEMPT_USERS:
                  raise PolicyError(f"exempt_user_ids must be a list of at most {MAX_EXEMPT_USERS} GitHub user ids")
              seen: set[int] = set()
              for value in exempt:
                  if not _is_int(value) or value < 1:
                      raise PolicyError("exempt_user_ids entries must be positive integer GitHub user ids")
                  if value in seen:
                      raise PolicyError("exempt_user_ids lists an id twice")
                  seen.add(value)
              dep_id = obj.get("dependabot_user_id", DEFAULT_CONFIG["dependabot_user_id"])
              if dep_id is not None and (not _is_int(dep_id) or dep_id < 1):
                  raise PolicyError("dependabot_user_id must be a positive integer GitHub user id or null")
              ci = obj.get("ci_checks", DEFAULT_CONFIG["ci_checks"])
              if not isinstance(ci, list) or len(ci) > MAX_CI_CHECKS:
                  raise PolicyError(f"ci_checks must be a list of at most {MAX_CI_CHECKS} check names")
              ci_seen: set[str] = set()
              for item in ci:
                  if not isinstance(item, str) or CHECK_NAME_RE.fullmatch(item) is None:
                      raise PolicyError("ci_checks entries must be GitHub check names")
                  if item in ci_seen:
                      raise PolicyError("ci_checks lists a check name twice")
                  ci_seen.add(item)
              apps = _apps(obj.get("apps"), "apps")
              private = _private_apps(
                  obj.get("private_apps", DEFAULT_CONFIG["private_apps"]),
                  "private_apps", {entry["slug"] for entry in apps.values()})
              return {
                  "version": CONFIG_VERSION,
                  "ci_checks": list(ci),
                  "max_lines": max_lines,
                  "max_files": max_files,
                  "exempt_user_ids": list(exempt),
                  "dependabot_user_id": dep_id,
                  "tooling_paths": _patterns(obj.get("tooling_paths", DEFAULT_CONFIG["tooling_paths"]),
                                             "tooling_paths", MAX_TOOLING_PATHS, allow_slash=True),
                  "dependency_files": _patterns(obj.get("dependency_files", DEFAULT_CONFIG["dependency_files"]),
                                                "dependency_files", MAX_DEPENDENCY_FILES, allow_slash=False),
                  "dependency_allow": _patterns(obj.get("dependency_allow", DEFAULT_CONFIG["dependency_allow"]),
                                                "dependency_allow", MAX_DEPENDENCY_ALLOW, allow_slash=True),
                  "apps": apps,
                  "private_apps": private,
              }


          # -- paths and matching -----------------------------------------------------

          _CONTROLS = re.compile(r"[\x00-\x1f\x7f-\x9f]")


          def normalize_path(path: Any) -> str:
              """A git path as the rules see it: strict UTF-8 (bytes in, else a
              refusal), NFC-normalized, and no traversal- or Windows-shaped
              segment. Anything else is refused as a bad path - never silently
              fixed (C7)."""
              if isinstance(path, (bytes, bytearray)):
                  try:
                      text = bytes(path).decode("utf-8")
                  except UnicodeDecodeError:
                      raise PolicyError("path is not valid UTF-8") from None
              elif isinstance(path, str):
                  text = path
              else:
                  raise PolicyError("path must be bytes or str")
              text = unicodedata.normalize("NFC", text)
              if not text:
                  raise PolicyError("path is empty")
              if text.startswith("/") or text.endswith("/"):
                  raise PolicyError("path must not start or end with '/'")
              if "//" in text or "\\" in text or "\x00" in text:
                  raise PolicyError("path must not contain '//', a backslash or a NUL")
              if _CONTROLS.search(text):
                  raise PolicyError("path must not contain control characters")
              for segment in text.split("/"):
                  if segment in (".", ".."):
                      raise PolicyError("path segments must not be '.' or '..'")
                  if segment.endswith(".") or segment.endswith(" "):
                      raise PolicyError("path segments must not end with '.' or a space")
              if posixpath.normpath(text) != text:
                  raise PolicyError("path is not normalized")
              return text


          def path_matches(folded: str, pattern: str) -> bool:
              """One config pattern against a casefolded path: a trailing '/' is
              the directory and everything under it, a pattern with a '/' is
              anchored at the repository root, one without matches the basename at
              any depth, and '*' never crosses a '/' (each segment matches alone).
              Patterns are casefolded here too, so the config can spell the
              conventional file names."""
              pattern = pattern.casefold()
              if pattern.endswith("/"):
                  base = pattern[:-1]
                  if "/" in base:
                      segments = base.split("/")
                      parts = folded.split("/")
                      if len(parts) < len(segments):
                          return False
                      return all(fnmatch.fnmatchcase(p, s) for p, s in zip(parts, segments))
                  return any(fnmatch.fnmatchcase(part, base) for part in folded.split("/"))
              if "/" in pattern:
                  segments = pattern.split("/")
                  parts = folded.split("/")
                  if len(parts) != len(segments):
                      return False
                  return all(fnmatch.fnmatchcase(p, s) for p, s in zip(parts, segments))
              return fnmatch.fnmatchcase(folded.split("/")[-1], pattern)


          # Built-in privileged paths (C2 + C7): always on, code and never config,
          # because they decide what the repository's automation does.
          _PRIVILEGED_BASENAMES = frozenset({
              "codeowners", "agents.md", "claude.md", "gemini.md", ".cursorrules", ".windsurfrules",
              ".devcontainer.json", ".npmrc", ".yarnrc", ".yarnrc.yml", ".pnpmfile.cjs",
              ".pre-commit-config.yaml", ".pre-commit-config.yml", ".pre-commit-hooks.yaml",
              "renovate.json", "renovate.json5", ".renovaterc", ".renovaterc.json", ".renovaterc.json5",
          })
          _PRIVILEGED_DIRS = frozenset({".cursor", ".claude", ".devcontainer", ".yarn", ".vscode"})


          def is_privileged_path(folded: str) -> bool:
              parts = folded.split("/")
              base = parts[-1]
              if folded == ".github" or folded.startswith(".github/"):
                  return True
              if base in _PRIVILEGED_BASENAMES:
                  return True
              if fnmatch.fnmatchcase(base, ".goreleaser.*") or fnmatch.fnmatchcase(base, "goreleaser.y*ml"):
                  return True
              if any(part in _PRIVILEGED_DIRS for part in parts[:-1]):
                  return True
              return folded == "npm/package.json"


          def is_dependency_file(folded: str, config: dict[str, Any]) -> bool:
              """A dependency manifest by basename, unless it matches
              dependency_allow (the one configured escape from this rule)."""
              base = folded.split("/")[-1]
              if not any(fnmatch.fnmatchcase(base, pattern.casefold()) for pattern in config["dependency_files"]):
                  return False
              return not any(path_matches(folded, pattern) for pattern in config["dependency_allow"])


          # -- the two diff-tree listings ----------------------------------------------

          _RAW_HEAD = re.compile(
              rb":([0-7]{6}) ([0-7]{6}) ([0-9a-f]{40}) ([0-9a-f]{40}) ([ADMT])", re.ASCII)


          def _z_fields(data: Any, what: str) -> list[bytes]:
              if not isinstance(data, (bytes, bytearray, memoryview)):
                  raise PolicyError(f"the {what} listing must be bytes")
              raw = bytes(data)
              if not raw:
                  return []
              if b"\x00" not in raw:
                  raise PolicyError(f"the {what} listing is not NUL-terminated")
              parts = raw.split(b"\x00")
              if parts[-1] != b"":
                  raise PolicyError(f"the {what} listing has trailing garbage")
              return parts[:-1]


          def parse_raw_z(data: Any) -> list[RawEntry]:
              """git diff-tree -r -z --raw --no-renames: :oldmode newmode oldsha
              newsha STATUS, a NUL, the path, a NUL. Statuses A, D, M and T only -
              anything else (a rename pair, a malformed mode or sha, a truncated or
              extended listing) is a parse error, never a guess."""
              fields = _z_fields(data, "raw")
              if len(fields) % 2 != 0:
                  raise PolicyError("the raw listing is truncated")
              entries: list[RawEntry] = []
              for i in range(0, len(fields), 2):
                  match = _RAW_HEAD.fullmatch(fields[i])
                  if match is None:
                      raise PolicyError("the raw listing holds a malformed entry")
                  entries.append(RawEntry(
                      old_mode=match.group(1).decode("ascii"),
                      new_mode=match.group(2).decode("ascii"),
                      old_sha=match.group(3).decode("ascii"),
                      new_sha=match.group(4).decode("ascii"),
                      status=match.group(5).decode("ascii"),
                      path=fields[i + 1],
                  ))
              if len(entries) > MAX_ENTRIES:
                  raise PolicyError("the diff holds more than the entry cap")
              return entries


          def parse_numstat_z(data: Any) -> list[NumstatEntry]:
              """git diff-tree -r -z --numstat: added, a tab, deleted, a tab, the
              path, a NUL. Both dashes mean binary."""
              fields = _z_fields(data, "numstat")
              entries: list[NumstatEntry] = []
              for chunk in fields:
                  parts = chunk.split(b"\t", 2)
                  if len(parts) != 3:
                      raise PolicyError("the numstat listing holds a malformed entry")
                  added, deleted, path = parts
                  if added == b"-" and deleted == b"-":
                      entries.append(NumstatEntry(path, None, None, True))
                      continue
                  if not added.isdigit() or not deleted.isdigit():
                      raise PolicyError("the numstat listing holds counts that are not numbers")
                  entries.append(NumstatEntry(path, int(added), int(deleted), False))
              if len(entries) > MAX_ENTRIES:
                  raise PolicyError("the diff holds more than the entry cap")
              return entries


          # -- scope and exemption ------------------------------------------------------

          @dataclass(frozen=True)
          class Scope:
              author_id: int
              head_repo_id: int
              base_repo_id: int
              repo_id: int
              head_ref: str
              base_ref: str
              default_branch: str

              @property
              def in_repo(self) -> bool:
                  return self.head_repo_id == self.base_repo_id == self.repo_id


          _SCOPE_INTS = ("author_id", "head_repo_id", "base_repo_id", "repo_id")
          _SCOPE_STRS = ("head_ref", "base_ref", "default_branch")
          _AGENT_REF_RE = re.compile(r"agent/", re.IGNORECASE)
          _DEPENDABOT_REF_RE = re.compile(r"dependabot/")
          # GitHub's web-flow user (id 19864447), which commits Dependabot's
          # signed commits: the only committer besides Dependabot itself the
          # verification accepts.
          _GITHUB_WEBFLOW_USER_ID = 19864447


          def read_scope(pr: Any) -> tuple[Scope | None, list[tuple[str, None]]]:
              """C10: the exemption may use only these values, each read by numeric
              id from the API payload. Anything missing or mistyped fails
              scope_unreadable and removes the exemption - every other rule still
              runs and is still reported."""
              if not isinstance(pr, dict):
                  return None, [("scope_unreadable", None)]
              values: dict[str, Any] = {}
              for name in _SCOPE_INTS:
                  if not _is_int(pr.get(name)):
                      return None, [("scope_unreadable", None)]
                  values[name] = pr[name]
              for name in _SCOPE_STRS:
                  if not isinstance(pr.get(name), str) or not pr[name]:
                      return None, [("scope_unreadable", None)]
                  values[name] = pr[name]
              scope = Scope(**values)
              failures: list[tuple[str, None]] = []
              if scope.base_ref != scope.default_branch:
                  failures.append(("base_not_default", None))
              return scope, failures


          def exemption_for(scope: Scope, config: dict[str, Any]) -> str:
              """"none", "jp" or "dependabot" (C8/C9/C10): by numeric id only, only
              for an in-repo PR, and never for a live agent/* head (A13). A login
              that merely looks like JP's never counts (A15/A20)."""
              if not scope.in_repo:
                  return "none"
              if _AGENT_REF_RE.match(scope.head_ref):
                  return "none"
              if scope.author_id in config["exempt_user_ids"]:
                  return "jp"
              dep_id = config["dependabot_user_id"]
              if dep_id is not None and scope.author_id == dep_id and _DEPENDABOT_REF_RE.match(scope.head_ref):
                  return "dependabot"
              return "none"


          def verify_dependabot_commits(commits: Any, head: str, dep_id: int) -> bool:
              """L1(iii): the Dependabot exemption holds only when EVERY commit in
              the PR is authored by Dependabot's GitHub user id (the user object,
              by id — never the git name or email) and committed by Dependabot or
              GitHub's web-flow user (which commits Dependabot's signed commits),
              within GitHub's 250-commit cap for a PR, and the last commit is
              exactly the PR head. A non-Dependabot pusher to the branch cannot
              ride the exemption. Anything missing, mistyped, unreadable, empty,
              over the cap or otherwise wrong is False: the caller removes the
              exemption and fails closed."""
              if not isinstance(commits, list) or not commits or len(commits) > MAX_PR_COMMITS:
                  return False
              for commit in commits:
                  if not isinstance(commit, dict):
                      return False
                  author = commit.get("author")
                  committer = commit.get("committer")
                  if not isinstance(author, dict) or not _is_int(author.get("id")) \
                          or author["id"] != dep_id:
                      return False
                  if not isinstance(committer, dict) or not _is_int(committer.get("id")) \
                          or committer["id"] not in (dep_id, _GITHUB_WEBFLOW_USER_ID):
                      return False
              last = commits[-1].get("sha")
              if not isinstance(last, str) or SHA_RE.fullmatch(last) is None or last != head:
                  return False
              return True


          # -- the two Dependabot-only content checks ----------------------------------

          _USES_LINE_RE = re.compile(
              r"(\s*-?\s*)uses:\s*([\"']?)([A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+)@([A-Za-z0-9_./-]+)\2"
              r"(\s+#[ A-Za-z0-9_.+/-]*)?\s*"
          )


          def is_action_pin_bump(diff_text: str) -> bool:
              """A Dependabot Action-pin bump: every changed line is a uses: line,
              removed and added lines pair 1:1 in order with the same prefix and
              (case-insensitively) the same action, and each new ref is a full
              40-hex commit sha. A run: line, a comment, a tag, a local action or a
              no-newline marker is not a pin bump (A21). Only the file header (up to
              the first @@ hunk) is skipped: `--- `/`+++ ` inside a hunk are changed
              lines whose content starts with a dash or a plus, so they fail the
              uses match instead of riding along."""
              removed: list[str] = []
              added: list[str] = []
              in_hunk = False
              for line in diff_text.split("\n"):
                  if line.startswith("@@"):
                      in_hunk = True
                      continue
                  if not in_hunk and line.startswith(("diff ", "index ", "--- ", "+++ ")):
                      continue
                  if line.startswith("\\"):
                      return False
                  if line.startswith("-"):
                      removed.append(line[1:])
                      continue
                  if line.startswith("+"):
                      added.append(line[1:])
                      continue
                  if line == "":
                      continue
                  return False
              if not removed or len(removed) != len(added):
                  return False
              for old, new in zip(removed, added):
                  m_old = _USES_LINE_RE.fullmatch(old)
                  m_new = _USES_LINE_RE.fullmatch(new)
                  if m_old is None or m_new is None:
                      return False
                  if m_old.group(1) != m_new.group(1):
                      return False
                  if m_old.group(3).lower() != m_new.group(3).lower():
                      return False
                  if "./" in m_old.group(3) or "./" in m_new.group(3):
                      return False
                  if SHA_RE.fullmatch(m_new.group(4)) is None:
                      return False
              return True


          _PACKAGE_JSON_KEYS = (
              "dependencies", "devDependencies", "optionalDependencies", "peerDependencies",
              "overrides", "resolutions", "packageManager",
          )


          def is_package_json_bump(old: bytes, new: bytes) -> bool:
              """True only when both package.json texts parse as JSON objects and
              are equal once the dependency keys are removed - so a scripts change,
              a new hook or any other edit is not a bump (A21)."""
              try:
                  old_obj = json.loads(old.decode("utf-8"))
                  new_obj = json.loads(new.decode("utf-8"))
              except (UnicodeDecodeError, ValueError):
                  return False
              if not isinstance(old_obj, dict) or not isinstance(new_obj, dict):
                  return False
              for obj in (old_obj, new_obj):
                  for key in _PACKAGE_JSON_KEYS:
                      obj.pop(key, None)
              return old_obj == new_obj


          def _display_path(raw: bytes) -> str | None:
              try:
                  return raw.decode("utf-8")
              except UnicodeDecodeError:
                  return None


          def _dependabot_entry_ok(entry: RawEntry, raw_path: str, config: dict[str, Any],
                                   blob: Callable[[str], bytes] | None,
                                   u0_diff: Callable[[str], bytes] | None) -> bool:
              """Whether one entry the Dependabot exemption may clear: (a) a
              dependency file - for any package.json both blobs must parse and
              match once the dependency keys are removed; or (b) an Action-pin
              bump in .github/workflows/<name>.y(a)ml. Old and new blob text and
              the U0 diff come from the caller, so the engine stays pure."""
              folded = raw_path.casefold()
              if is_dependency_file(folded, config):
                  if folded.split("/")[-1] == "package.json":
                      if blob is None:
                          return False
                      try:
                          return is_package_json_bump(blob(entry.old_sha), blob(entry.new_sha))
                      except Exception:  # noqa: BLE001 - unreadable blobs mean "not cleared"
                          return False
                  return True
              # L1(ii): fnmatch's `*` crosses '/', so the workflow match is split:
              # the .github/workflows/ prefix, then ONE segment (no '/' in it),
              # then the .yml/.yaml suffix. A composite action at
              # .github/workflows/sub/x.yml is under .github/ (privileged) and is
              # NOT a workflow file the pin-bump clearing may touch.
              prefix = ".github/workflows/"
              name = folded[len(prefix):] if folded.startswith(prefix) else ""
              is_workflow = bool(name) and "/" not in name and name.endswith((".yml", ".yaml"))
              if (entry.status == "M" and entry.old_mode == "100644" and entry.new_mode == "100644"
                      and is_workflow):
                  if u0_diff is None:
                      return False
                  try:
                      return is_action_pin_bump(u0_diff(raw_path).decode("utf-8"))
                  except Exception:  # noqa: BLE001 - an unreadable diff means "not cleared"
                      return False
              return False


          # -- evaluation ---------------------------------------------------------------

          def _mode_failures(entry: RawEntry, stat: NumstatEntry, path: str | None,
                             folded: str | None) -> list[tuple[str, str | None]]:
              """The always-on rules (A24): these run for exempt PRs too."""
              out: list[tuple[str, str | None]] = []
              base = folded.split("/")[-1] if folded else ""
              if entry.old_mode == "120000" or entry.new_mode == "120000":
                  out.append(("symlink", path))
              if entry.old_mode == "160000" or entry.new_mode == "160000" or base == ".gitmodules":
                  out.append(("submodule", path))
              if base == ".gitattributes":
                  out.append(("gitattributes", path))
              if base == ".lfsconfig":
                  # Like .gitattributes: it can redirect where LFS smudge filters
                  # fetch from, so not even an exempt PR changes it.
                  out.append(("lfsconfig", path))
              if stat.binary:
                  out.append(("binary", path))
              return out


          def _entry_failures(entry: RawEntry, stat: NumstatEntry, config: dict[str, Any], exempt: str,
                              blob: Callable[[str], bytes] | None,
                              u0_diff: Callable[[str], bytes] | None) -> list[tuple[str, str | None]]:
              try:
                  path = normalize_path(entry.path)
              except PolicyError:
                  # Fail closed and keep checking what is readable without the path.
                  out = [("bad_path", _display_path(entry.path))]
                  out.extend(_mode_failures(entry, stat, None, None))
                  return out
              folded = path.casefold()
              out = _mode_failures(entry, stat, path, folded)
              if exempt == "jp":
                  return out  # C8: every exemptible failure is cleared
              privileged = is_privileged_path(folded)
              tooling = any(path_matches(folded, p) for p in config["tooling_paths"])
              dependency = is_dependency_file(folded, config)
              if exempt == "dependabot" and (privileged or tooling or dependency) \
                      and _dependabot_entry_ok(entry, path, config, blob, u0_diff):
                  return out
              if privileged:
                  out.append(("privileged_path", path))
              if tooling:
                  out.append(("tooling_path", path))
              if dependency:
                  out.append(("dependency_file", path))
              return out


          def evaluate(changes: list[RawEntry], numstat: list[NumstatEntry], pr: Any, config: Any, *,
                       blob: Callable[[str], bytes] | None = None,
                       u0_diff: Callable[[str], bytes] | None = None,
                       dependabot_commits_ok: bool = False) -> Result:
              """The rule list over one diff. Both listings must cover the same
              paths in the same order. `blob` and `u0_diff` supply old/new blob
              text and the U0 diff for the Dependabot content checks, and
              `dependabot_commits_ok` is the verified result of reading the PR's
              commits from the API (L1(iii): the Dependabot exemption holds only
              when every commit is Dependabot's own; anything else removes it and
              reports dependabot_commits_unverified). The engine itself runs no
              git and no API call."""
              cfg = validate_config(config)
              if len(changes) != len(numstat):
                  raise PolicyError("the raw and numstat listings differ in length")
              if [e.path for e in changes] != [s.path for s in numstat]:
                  raise PolicyError("the raw and numstat listings disagree")
              if len(changes) > MAX_ENTRIES:
                  raise PolicyError("the diff holds more than the entry cap")
              failures: list[tuple[str, str | None]] = []
              scope, scope_failures = read_scope(pr)
              failures.extend(scope_failures)
              exempt = exemption_for(scope, cfg) if scope is not None else "none"
              if exempt == "dependabot" and not dependabot_commits_ok:
                  # L1(iii): the PR author's id alone never carries the exemption.
                  # Every commit in the PR must be Dependabot's own, verified from
                  # the API by id; unverified or unreadable removes the exemption
                  # and fails the check while every rule still runs and reports.
                  exempt = "none"
                  failures.append(("dependabot_commits_unverified", None))
              total_lines = 0
              for entry, stat in zip(changes, numstat):
                  if stat.binary:
                      continue
                  if exempt == "jp" and _is_generated_workflow_update(entry, cfg, blob):
                      continue  # L1: JP's self-consistent policy workflow render
                  total_lines += (stat.added or 0) + (stat.deleted or 0)
              if len(changes) > cfg["max_files"]:
                  failures.append(("too_many_files", None))
              if total_lines > cfg["max_lines"]:
                  failures.append(("too_many_lines", None))
              for entry, stat in zip(changes, numstat):
                  failures.extend(_entry_failures(entry, stat, cfg, exempt, blob, u0_diff))
              return Result(ok=not failures, failures=failures, exempt=exempt)


          def _is_generated_workflow_update(entry: RawEntry, cfg: dict[str, Any],
                                            blob: Callable[[str], bytes] | None) -> bool:
              """True only for an add or in-place update of POLICY_WORKFLOW_PATH,
              as a regular 0644 file, whose new blob is a generated render for this
              exact config. Anything unreadable or unexpected counts normally."""
              if blob is None or entry.path != POLICY_WORKFLOW_PATH.encode("ascii"):
                  return False
              if entry.new_mode != "100644":
                  return False
              if not (entry.status == "A" or (entry.status == "M" and entry.old_mode == "100644")):
                  return False
              try:
                  return is_generated_workflow(blob(entry.new_sha), cfg)
              except Exception:  # noqa: BLE001 - an unreadable blob means "count it"
                  return False


          def _workflow_frame(workflow_text: str) -> str:
              """The rendered workflow minus what legitimately varies: the header
              line, the policy body and the CONFIG_JSON line."""
              lines = workflow_text.split("\n")
              if lines.count(_HEREDOC_FIRST) != 1 or lines.count(_HEREDOC_LAST) != 1:
                  raise PolicyError("the workflow must hold exactly one embedded policy script")
              start = lines.index(_HEREDOC_FIRST)
              end = lines.index(_HEREDOC_LAST)
              if end - start < 3:
                  raise PolicyError("the embedded policy script is truncated")
              return "\n".join(lines[1:start + 1] + ["<CONFIG_JSON>", lines[end - 1]] + lines[end:])


          def workflow_frame_sha256(workflow_text: str) -> str:
              return hashlib.sha256(_workflow_frame(workflow_text).encode("utf-8")).hexdigest()


          def is_generated_workflow(data: Any, config: Any) -> bool:
              """A self-consistent render of the policy workflow for `config`."""
              if not isinstance(data, bytes) or len(data) > MAX_GENERATED_WORKFLOW_BYTES:
                  return False
              try:
                  text = data.decode("utf-8")
                  if "\r" in text or text.count("\n") > GENERATED_WORKFLOW_MAX_LINES:
                      return False
                  header = _GENERATED_HEADER_RE.fullmatch(text.split("\n", 1)[0])
                  if header is None:
                      return False
                  source = extract_policy_source(text)
                  embedded = extract_config(text)
                  cfg = validate_config(config)
              except (UnicodeDecodeError, PolicyError, ValueError, RecursionError):
                  return False
              canonical = json.dumps(cfg, sort_keys=True, separators=(",", ":"))
              if json.dumps(embedded, sort_keys=True, separators=(",", ":")) != canonical:
                  return False
              try:
                  frame = workflow_frame_sha256(text)
              except PolicyError:
                  return False
              return (hashlib.sha256(source.encode("utf-8")).hexdigest() == header.group(1)
                      and hashlib.sha256(canonical.encode("utf-8")).hexdigest() == header.group(2)
                      and frame == GENERATED_WORKFLOW_FRAME_SHA256)


          # -- the rendered workflow's embedded pieces -----------------------------------

          def extract_config(workflow_text: Any) -> dict[str, Any]:
              """The config a rendered workflow carries: exactly one CONFIG_JSON
              line, a Python string literal, then JSON and the same validation the
              workflow itself runs. Anything else is refused."""
              if not isinstance(workflow_text, str):
                  raise PolicyError("workflow text must be a string")
              hits = [m for m in map(_CONFIG_LINE_RE.match, workflow_text.split("\n")) if m is not None]
              if len(hits) != 1:
                  raise PolicyError("the workflow must hold exactly one CONFIG_JSON line")
              try:
                  value = ast.literal_eval(hits[0].group(1))
              except (ValueError, SyntaxError):
                  raise PolicyError("the CONFIG_JSON line is not a Python literal") from None
              if not isinstance(value, str):
                  raise PolicyError("CONFIG_JSON must be a string literal")
              try:
                  obj = json.loads(value)
              except ValueError:
                  raise PolicyError("CONFIG_JSON is not valid JSON") from None
              return validate_config(obj)


          def extract_policy_source(workflow_text: Any) -> str:
              """The policy source embedded in a rendered workflow: the de-indented
              heredoc body without its two trailer lines."""
              if not isinstance(workflow_text, str):
                  raise PolicyError("workflow text must be a string")
              lines = workflow_text.split("\n")
              if _HEREDOC_FIRST not in lines or _HEREDOC_LAST not in lines:
                  raise PolicyError("the workflow holds no embedded policy script")
              start = lines.index(_HEREDOC_FIRST)
              end = lines.index(_HEREDOC_LAST)
              if start >= end or end - start < 3:
                  raise PolicyError("the embedded policy script is truncated")
              body = lines[start + 1:end]
              if not body[-2].startswith(_INDENT + "CONFIG_JSON = ") \
                      or not body[-1].startswith(_INDENT + "raise SystemExit("):
                  raise PolicyError("the embedded policy script is malformed")
              out: list[str] = []
              for line in body[:-2]:
                  if line == "":
                      out.append("")
                  elif line.startswith(_INDENT):
                      out.append(line[len(_INDENT):])
                  else:
                      raise PolicyError("the embedded policy script is not indented")
              return "\n".join(out) + "\n"


          # -- the GitHub Actions entrypoint --------------------------------------------

          _ENV_KEYS = ("GITHUB_EVENT_PATH", "GITHUB_REPOSITORY", "GITHUB_REPOSITORY_ID",
                       "GITHUB_API_URL", "GITHUB_SERVER_URL", "GITHUB_TOKEN")
          _OPENER: Any = None


          def _opener() -> Any:
              """HTTP(S) only, TLS verified, and no redirect handler: a 3xx fails
              closed instead of re-sending the Authorization header elsewhere."""
              global _OPENER
              if _OPENER is None:
                  opener = urllib.request.OpenerDirector()
                  for handler in (
                      urllib.request.ProxyHandler({}),
                      urllib.request.HTTPHandler(),
                      urllib.request.HTTPSHandler(),
                      urllib.request.HTTPDefaultErrorHandler(),
                      urllib.request.HTTPErrorProcessor(),
                  ):
                      opener.add_handler(handler)
                  _OPENER = opener
              return _OPENER


          def _api_get(url: str, token: str) -> Any:
              request = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "batarang-policy/1.0",
                  "Authorization": "Bearer " + token,
              }, method="GET")
              try:
                  with _opener().open(request, timeout=API_TIMEOUT_SECONDS) as resp:
                      raw = resp.read(MAX_API_BODY + 1)
              except urllib.error.HTTPError:
                  raise PolicyError("the GitHub API answered an error") from None
              except (OSError, ValueError) as exc:
                  raise PolicyError("the GitHub API is unreachable") from exc
              if len(raw) > MAX_API_BODY:
                  raise PolicyError("the GitHub API response is over the cap")
              if not raw:
                  return None
              try:
                  return json.loads(raw.decode("utf-8"))
              except (UnicodeDecodeError, ValueError):
                  raise PolicyError("the GitHub API response is not JSON") from None


          def _pull_commits(api: str, repo_path: str, number: int, token: str) -> "list[Any] | None":
              """The PR's commit listing (L1(iii), read only when the scope would
              be Dependabot's), paged at 100 a page and at most three pages
              (GitHub caps the listing at MAX_PR_COMMITS commits). Any error, an
              unreachable page or a page that is not an array is None:
              unreadable, never a guess."""
              commits: list[Any] = []
              for page in (1, 2, 3):
                  url = f"{api}{repo_path}/pulls/{number}/commits?per_page=100&page={page}"
                  try:
                      batch = _api_get(url, token)
                  except PolicyError:
                      return None
                  if not isinstance(batch, list):
                      return None
                  commits.extend(batch)
                  if len(batch) < 100:
                      return commits
              return commits


          def _git_env(home: str, server: str, token: str, test_mode: bool) -> dict[str, str]:
              """A scratch environment for the throwaway bare repository: no system
              or global config, no attributes, no hooks, no prompts. The token
              rides in GIT_CONFIG_* environment variables only - never argv, never
              a printed value. In test mode (a local bare repository and a fake API
              on loopback) no token header is set at all. GIT_LITERAL_PATHSPECS
              makes every path after `--` a literal filename: a repo file literally
              named like `.github/workflows/*.yml` is diffed alone, never treated as
              a glob that would pull other files into the Dependabot pin-bump
              diff."""
              env = {
                  "PATH": "/usr/bin:/bin",
                  "HOME": home,
                  "LC_ALL": "C",
                  "GIT_CONFIG_NOSYSTEM": "1",
                  "GIT_CONFIG_GLOBAL": "/dev/null",
                  "GIT_ATTR_NOSYSTEM": "1",
                  "GIT_TERMINAL_PROMPT": "0",
                  "GIT_LITERAL_PATHSPECS": "1",
              }
              if not test_mode:
                  basic = base64.b64encode(("x-access-token:" + token).encode("ascii")).decode("ascii")
                  env.update({
                      "GIT_CONFIG_COUNT": "1",
                      "GIT_CONFIG_KEY_0": "http." + server + "/.extraHeader",
                      "GIT_CONFIG_VALUE_0": "Authorization: Basic " + basic,
                  })
              return env


          def _git(cwd: str, env: dict[str, str], extra: tuple[str, ...], *args: str) -> bytes:
              """git plumbing only, with a fixed argv, no shell, a timeout and a
              capped stdout; any non-zero exit fails closed. The fetch URL and the
              diff paths come from git's own listings, never from the PR body."""
              argv = ["/usr/bin/git",
                      "-c", "core.hooksPath=/dev/null",
                      "-c", "core.fsmonitor=false",
                      "-c", "core.attributesFile=/dev/null",
                      "-c", "protocol.allow=never",
                      *extra, *args]
              try:
                  proc = subprocess.run(argv, cwd=cwd, env=env, stdin=subprocess.DEVNULL,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                        timeout=GIT_TIMEOUT_SECONDS, check=False, shell=False)
              except (OSError, subprocess.TimeoutExpired) as exc:
                  raise GitCheckError("git did not run") from exc
              if proc.returncode != 0 or len(proc.stdout) > MAX_GIT_OUTPUT:
                  raise GitCheckError("git did not answer cleanly")
              return proc.stdout


          def _failed(code: str) -> Result:
              return Result(ok=False, failures=[(code, None)], exempt="none")


          def _report_text(result: Result) -> str:
              lines: list[str] = []
              for code, path in result.failures:
                  if len(lines) >= MAX_REPORT_LINES:
                      break
                  if path is None:
                      lines.append(code)
                  else:
                      clean = "".join(ch if 32 <= ord(ch) < 127 else "?" for ch in path)
                      lines.append(code + ": " + clean[:MAX_REPORT_PATH_CHARS])
              verdict = "batarang/policy: PASS" if result.ok else "batarang/policy: FAIL"
              return "\n".join(lines + [verdict]) + "\n"


          def _emit(result: Result) -> None:
              """The report: rule codes and sanitized paths only - never the token,
              never file contents - and the same text appended to the step summary
              when GitHub sets one."""
              text = _report_text(result)
              sys.stdout.write(text)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  try:
                      with open(summary, "a", encoding="utf-8") as fh:
                          fh.write(text)
                  except OSError:
                      pass


          def _side(pull: dict[str, Any], name: str) -> dict[str, Any]:
              side = pull.get(name)
              return side if isinstance(side, dict) else {}


          def _side_repo_id(side: dict[str, Any]) -> int | None:
              repo_obj = side.get("repo")
              if not isinstance(repo_obj, dict) or not _is_int(repo_obj.get("id")):
                  return None
              return int(repo_obj["id"])


          def _run(config_json: str) -> int:
              # 1. The config, the environment and the event payload.
              try:
                  cfg = validate_config(json.loads(config_json))
              except ValueError:
                  _emit(_failed("config_invalid"))
                  return 1
              env = os.environ
              if [k for k in _ENV_KEYS if not env.get(k)]:
                  _emit(_failed("env_missing"))
                  return 1
              repo = env["GITHUB_REPOSITORY"]
              if not isinstance(repo, str) or _REPO_ENV_RE.fullmatch(repo) is None:
                  _emit(_failed("env_missing"))
                  return 1
              try:
                  repo_id = int(env["GITHUB_REPOSITORY_ID"])
              except ValueError:
                  _emit(_failed("env_missing"))
                  return 1
              if not 0 < repo_id <= 2**53:
                  _emit(_failed("env_missing"))
                  return 1
              try:
                  with open(env["GITHUB_EVENT_PATH"], "rb") as fh:
                      data = fh.read(MAX_EVENT_BODY + 1)
              except OSError:
                  _emit(_failed("env_missing"))
                  return 1
              if len(data) > MAX_EVENT_BODY:
                  _emit(_failed("env_missing"))
                  return 1
              try:
                  event = json.loads(data.decode("utf-8"))
              except (UnicodeDecodeError, ValueError):
                  _emit(_failed("env_missing"))
                  return 1
              pr_event = event.get("pull_request") if isinstance(event, dict) else None
              number = pr_event.get("number") if isinstance(pr_event, dict) else None
              head_side = pr_event.get("head") if isinstance(pr_event, dict) else None
              event_head = head_side.get("sha") if isinstance(head_side, dict) else None
              if not _is_int(number) or not isinstance(event_head, str) or SHA_RE.fullmatch(event_head) is None:
                  _emit(_failed("env_missing"))
                  return 1

              api = env["GITHUB_API_URL"].rstrip("/")
              server = env["GITHUB_SERVER_URL"].rstrip("/")
              token = env["GITHUB_TOKEN"]
              owner, _, name = repo.partition("/")
              repo_path = "/repos/" + quote(owner, safe="") + "/" + quote(name, safe="")

              # 2. The API reads: only the PR's scope fields, each by numeric id.
              try:
                  repo_obj = _api_get(api + repo_path, token)
                  pull = _api_get(api + repo_path + "/pulls/" + str(number), token)
              except PolicyError:
                  _emit(_failed("scope_unreadable"))
                  return 1
              if not isinstance(repo_obj, dict) or not _is_int(repo_obj.get("id")) or repo_obj["id"] != repo_id:
                  _emit(_failed("scope_unreadable"))
                  return 1
              default_branch = repo_obj.get("default_branch")
              if not isinstance(default_branch, str) or not default_branch:
                  _emit(_failed("scope_unreadable"))
                  return 1
              if not isinstance(pull, dict):
                  _emit(_failed("scope_unreadable"))
                  return 1
              head = _side(pull, "head")
              api_head = head.get("sha")
              state = pull.get("state")
              if not isinstance(api_head, str) or SHA_RE.fullmatch(api_head) is None \
                      or not isinstance(state, str):
                  _emit(_failed("scope_unreadable"))
                  return 1
              if api_head != event_head:
                  # A newer run follows; the latest attempt wins.
                  _emit(_failed("stale_head"))
                  return 1
              if state != "open":
                  _emit(_failed("pr_not_open"))
                  return 1
              user = pull.get("user")
              pr = {
                  "author_id": user.get("id") if isinstance(user, dict) else None,
                  "head_repo_id": _side_repo_id(head),
                  "base_repo_id": _side_repo_id(_side(pull, "base")),
                  "repo_id": repo_id,
                  "head_ref": head.get("ref") if isinstance(head.get("ref"), str) else None,
                  "base_ref": _side(pull, "base").get("ref"),
                  "default_branch": default_branch,
              }

              # 2b. L1(iii): when (and only when) the scope would be Dependabot's,
              # every commit in the PR must be Dependabot's own, read from the API
              # by id with this workflow's read-only token (pull-requests: read is
              # already granted; no permission is added). Anything unreadable,
              # mistyped, over GitHub's 250-commit cap, with a last commit that is
              # not the PR head, or authored by anyone else removes the exemption
              # (the check reports dependabot_commits_unverified and every rule
              # still runs and reports). JP's exemption is unchanged.
              scope_probe, _probe = read_scope(pr)
              dep_commits_ok = False
              if scope_probe is not None and exemption_for(scope_probe, cfg) == "dependabot":
                  commits = _pull_commits(api, repo_path, number, token)
                  dep_commits_ok = commits is not None and verify_dependabot_commits(
                      commits, api_head, cfg["dependabot_user_id"])

              # 3. git plumbing in a throwaway bare repository (HEAD unborn, so no
              # attributes are read from any tree). Nothing from the PR is checked
              # out, executed, installed or imported (C1).
              test_mode = server.startswith("file:///") and _TEST_API_RE.fullmatch(api) is not None
              extra = ("-c", "protocol.file.allow=always") if test_mode else \
                  ("-c", "protocol.https.allow=always")
              with tempfile.TemporaryDirectory(prefix="batarang-policy-") as work:
                  bare = os.path.join(work, "repo.git")
                  genv = _git_env(work, server, token, test_mode)
                  try:
                      _git(work, genv, extra, "init", "--bare", "--template=", bare)
                      _git(bare, genv, extra, "check-ref-format", "--branch", default_branch)
                      _git(bare, genv, extra, "fetch", "--no-tags", "--no-recurse-submodules",
                           server + "/" + repo + ".git",
                           "+refs/heads/" + default_branch + ":refs/b/base",
                           "+refs/pull/" + str(number) + "/head:refs/b/head")
                      head_commit = _git(bare, genv, extra, "rev-parse", "refs/b/head").decode("ascii", "replace").strip()
                  except PolicyError:
                      _emit(_failed("git_error"))
                      return 1
                  if SHA_RE.fullmatch(head_commit) is None:
                      _emit(_failed("git_error"))
                      return 1
                  if head_commit != api_head:
                      _emit(_failed("stale_head"))
                      return 1
                  try:
                      merge_base = _git(bare, genv, extra, "merge-base", "refs/b/base", "refs/b/head") \
                          .decode("ascii", "replace").strip()
                  except PolicyError:
                      _emit(_failed("parse_error"))
                      return 1
                  if SHA_RE.fullmatch(merge_base) is None:
                      _emit(_failed("parse_error"))
                      return 1
                  try:
                      raw = _git(bare, genv, extra, "diff-tree", "-r", "-z", "--raw", "--no-renames",
                                 "--no-ext-diff", "--no-textconv", "--full-index", merge_base, head_commit)
                      stats = _git(bare, genv, extra, "diff-tree", "-r", "-z", "--numstat",
                                   "--no-renames", "--no-ext-diff", "--no-textconv", merge_base, head_commit)
                  except PolicyError:
                      _emit(_failed("git_error"))
                      return 1

                  def blob(sha: str) -> bytes:
                      return _git(bare, genv, extra, "cat-file", "blob", sha)

                  def u0_diff(path: str) -> bytes:
                      return _git(bare, genv, extra, "diff", "-U0", "--no-ext-diff", "--no-textconv",
                                  "--no-color", "--no-renames", merge_base, head_commit, "--", path)

                  try:
                      changes = parse_raw_z(raw)
                      numstat = parse_numstat_z(stats)
                      result = evaluate(changes, numstat, pr, cfg, blob=blob, u0_diff=u0_diff,
                                        dependabot_commits_ok=dep_commits_ok)
                  except PolicyError:
                      result = _failed("parse_error")
              _emit(result)
              return 0 if result.ok else 1


          def actions_main(config_json: str) -> int:
              """The GitHub Actions entrypoint: 0 only for a clean PASS, 1 for
              every failure, and a fixed policy_error line (never an exception
              trace, never the token) for anything unexpected."""
              try:
                  return _run(config_json)
              except SystemExit:
                  raise
              except BaseException:  # noqa: BLE001 - a fixed code only, never the exception
                  try:
                      _emit(_failed("policy_error"))
                  except Exception:  # noqa: BLE001 - reporting must never crash the exit
                      pass
                  return 1
