          _CONFIG_KEYS = frozenset(DEFAULT_CONFIG)
          # Config patterns are ASCII only, and are casefolded at validation time
          # (paths are matched casefolded, C7), so "Makefile" and "makefile" are one
          # pattern; the default list spells the conventional file names.
          _PATTERN_RE = re.compile(r"[a-z0-9._*/-]+", re.ASCII)
          # A required-check name as GitHub writes it: the same shape onboard uses
          # when it pins the fixed checks (batarang/policy, qa/verdict, ...).
          CHECK_NAME_RE = re.compile(r"[A-Za-z0-9][A-Za-z0-9 ._/(),:\[\]-]{0,99}", re.ASCII)
          # A GitHub App slug as the API writes it: lowercase ASCII letters and
          # digits with hyphens, an alphanumeric start and end.
          APP_SLUG_RE = re.compile(r"[a-z0-9](?:[a-z0-9-]*[a-z0-9])?", re.ASCII)
          MAX_APP_SLUG_LEN = 39
