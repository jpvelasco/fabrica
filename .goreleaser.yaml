version: 2

# Regenerate the redistribution notice file from the live dependency graph
# (go-licenses report + save) before building. Runs on every goreleaser
# invocation that executes `before` hooks. The CI `licenses` job and the
# goreleaser snapshot job (see .github/workflows) also invoke the script
# directly, so the file is generated even on paths where hooks are skipped.
before:
  hooks:
    - bash scripts/third-party-notices.sh

builds:
  - id: fabrica
    main: .
    binary: fabrica
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/jpvelasco/fabrica/internal/version.Version={{ .Version }}
      - -X github.com/jpvelasco/fabrica/internal/version.Commit={{ .ShortCommit }}
    # -trimpath strips local file paths from the binary, and mod_timestamp
    # pins the build mtime to the commit, so a re-run against the same tag
    # (or the goreleaser snapshot job) produces byte-identical binaries.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: fabrica
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "fabrica_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Pin archive entry mtimes to the commit date so archive bytes are
    # stable across re-runs. The build itself is reproducible as well:
    # -trimpath (builds.flags) drops local file paths and builds'
    # mod_timestamp pins the binary mtime to the commit.
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: CHANGELOG.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: THIRD_PARTY_NOTICES.txt
        info:
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  # Dormant safety: this block documents that a GitHub Release is created only
  # when GoReleaser runs against a real tag (via release.yml on a v* push).
  # `--snapshot` (used for verification) never publishes or creates a release.
  prerelease: auto
  # Publish as a draft so the npm package can be verified before anything
  # ships. Re-running the workflow against the same tag replaces the existing
  # draft and its artifacts instead of failing or creating a second release.
  draft: true
  replace_existing_draft: true
  replace_existing_artifacts: true
