version: 2

# Regenerate the redistribution notice file from the live dependency graph
# (go-licenses report + save) before building. Runs on every goreleaser
# invocation that executes `before` hooks. The CI `licenses` job and the
# goreleaser snapshot job (see .github/workflows) also invoke the script
# directly, so the file is generated even on paths where hooks are skipped.
before:
  hooks:
    - bash scripts/third-party-notices.sh

builds:
  - id: fabrica
    main: .
    binary: fabrica
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/jpvelasco/fabrica/internal/version.Version={{ .Version }}
      - -X github.com/jpvelasco/fabrica/internal/version.Commit={{ .ShortCommit }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: fabrica
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "fabrica_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - CHANGELOG.md
      - README.md
      - THIRD_PARTY_NOTICES.txt

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  # Dormant safety: this block documents that a GitHub Release is created only
  # when GoReleaser runs against a real tag (via release.yml on a v* push).
  # `--snapshot` (used for verification) never publishes or creates a release.
  prerelease: auto
